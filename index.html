  let state = {
    lang: "en",
    province: "on",
    plan: "tou",
    siteCount: 1,
    sectors: 3, has4g: true, has5g: false, override: false, overrideKw: 5,
    hasGenerator: false, ldc: "hydroone",
    batteryN: 4, outageHours: 2.9, batteryPrice: 1500, horizonYears: 10,
    activeDayType: { tou: "winter-weekday", ulo: "weekday", flexG: "qc-event" },
  };

  const OUTAGE_HOURS_DEFAULT = { on: 2.9, qc: 2.1 };
  const GENERATOR_OUTAGE_HOURS_DEFAULT = 0.5;

  // ---------- Ontario LDC reliability data (2024 OEB Electricity Distributor Scorecard, "Average Number of Hours/Times that Power to a Customer is Interrupted") ----------
  // SAIDI/SAIFI are 3-year averages (2022-2024) from each company's official OEB Electricity Distributor Scorecards --
  // averaging smooths out single-year noise (e.g. Oshawa PUC's 2024 was its best year in 5, Welland's most volatile).
  // customers: approximate, most recent company-reported figures (not all the same vintage as the reliability data).
  const LDC_CAIDI = {
    hydroone:    { name: "Hydro One",           saidi: 7.37, saifi: 2.67, customers: 1500000 },
    alectra:     { name: "Alectra Utilities",   saidi: 0.82, saifi: 1.07, customers: 1000000 },
    torontohydro:{ name: "Toronto Hydro",       saidi: 0.85, saifi: 1.31, customers: 790000 },
    hydroottawa: { name: "Hydro Ottawa",        saidi: 0.97, saifi: 0.62, customers: 364000 },
    elexicon:    { name: "Elexicon Energy",     saidi: 1.60, saifi: 1.11, customers: 177000 },
    londonhydro: { name: "London Hydro",        saidi: 0.72, saifi: 0.93, customers: 169000 },
    enova:       { name: "Enova Power",         saidi: 0.88, saifi: 0.91, customers: 165000 },
    burlington:  { name: "Burlington Hydro",    saidi: 1.86, saifi: 1.32, customers: 68500 },
    oshawapuc:   { name: "Oshawa PUC Networks", saidi: 0.86, saifi: 0.71, customers: 63000 },
    welland:     { name: "Welland Hydro",       saidi: 1.08, saifi: 0.88, customers: 26000 },
  };
  // [light, dark] fill colors per LDC territory, matching map + legend swatches
  const LDC_COLORS = {
    hydroone:     ["#8B93A0", "#A8B0BD"],
    alectra:      ["#3F8F8F", "#5CB3B3"],
    torontohydro: ["#D97D3D", "#E8945A"],
    hydroottawa:  ["#A0446B", "#C46389"],
    elexicon:     ["#B8452A", "#D66B4C"],
    londonhydro:  ["#4F8556", "#6DAA75"],
    enova:        ["#5B5EA6", "#7C7FC9"],
    burlington:   ["#3670A6", "#5A93C9"],
    oshawapuc:    ["#C99A2E", "#E0B84F"],
    welland:      ["#8B5FA6", "#AB84C9"],
  };
  function ldcCaidi(key) {
    const d = LDC_CAIDI[key];
    return d ? d.saidi / d.saifi : null;
  }
  function fmtCustomers(n) {
    if (n >= 1000000) return (n / 1000000).toFixed(n % 1000000 === 0 ? 0 : 1) + "M";
    return Math.round(n / 1000) + "K";
  }
  function selectLdcFromMap(key) {
    state.ldc = key;
    $("#ldcSelect").value = key;
    applyStaticText();
    render();
  }
  function setLdcHighlight(key) {
    $$(".ldc-territory").forEach(el => {
      el.classList.toggle("is-selected", key && el.dataset.key === key);
      el.classList.toggle("is-dimmed", !!key && el.dataset.key !== key);
    });
    const card = $("#ldcInfoCard");
    if (key && LDC_CAIDI[key]) {
      const d = LDC_CAIDI[key];
      $("#ldcInfoSwatch").style.cssText = `--c-light:${LDC_COLORS[key][0]}; --c-dark:${LDC_COLORS[key][1]};`;
      $("#ldcInfoName").textContent = d.name;
      $("#ldcInfoStats").textContent = `${fmtCustomers(d.customers)} ${t("lblCustomers")} · CAIDI ${ldcCaidi(key).toFixed(2)}h`;
      card.classList.add("is-active");
    } else {
      card.classList.remove("is-active");
    }
  }

  function updatePlanOptions() {
    const sel = $("#planSelect");
    if (state.province === "qc") {
      sel.innerHTML = `<option value="flexG" id="opt-flexG"></option>`;
      state.plan = "flexG";
      sel.disabled = true;
    } else {
      sel.innerHTML = `<option value="tou" id="opt-tou"></option><option value="ulo" id="opt-ulo"></option>`;
      if (state.plan === "flexG") state.plan = "tou";
      sel.disabled = false;
    }
    sel.value = state.plan;
  }

  const $ = sel => document.querySelector(sel);
  const $$ = sel => document.querySelectorAll(sel);

  function fmtMoney(cents) {
    return (cents / 100).toLocaleString("en-CA", { style: "currency", currency: "CAD", maximumFractionDigits: 0 });
  }

  function computeSiteKw() {
    if (state.override) return state.overrideKw;
    return SITE_FIXED_KW + state.sectors * ((state.has4g ? KW_PER_SECTOR_4G : 0) + (state.has5g ? KW_PER_SECTOR_5G : 0));
  }

  function priceTierClass(price, hourly) {
    const uniq = [...new Set(hourly)].sort((a, b) => a - b);
    if (uniq.length <= 1) return "cheap";
    if (price <= uniq[0]) return "cheap";
    if (price >= uniq[uniq.length - 1]) return "expensive";
    return "mid";
  }

  function priceSegments(hourly) {
    const segs = [];
    let start = 0;
    for (let h = 1; h <= 24; h++) {
      if (h === 24 || hourly[h] !== hourly[start]) {
        segs.push({ start, end: h, price: hourly[start] });
        start = h;
      }
    }
    return segs;
  }

  function renderPlanCard(plan, P, usableKwh, maxKw, reserveKwh) {
    const annual = annualSavings(plan, P, usableKwh, maxKw);

    const activeKey = state.activeDayType[plan.key];
    const activeDT = plan.dayTypes.find(d => d.key === activeKey) || plan.dayTypes[0];
    const sim = simulateDay(activeDT.hourly, P, usableKwh, maxKw);
    const maxBar = Math.max(P, ...sim.hours.map(h => h.grid)) * 1.15 || 1;

    const [c1, c2, c3] = plan.bandKeys;
    const hs = t("hourSuffix");

    return `
      <div class="plan-card ${plan.key}">
        <div class="plan-card-head">
          <span class="name">${t("planLabel", plan.key)}</span>
          <span class="spread">${t("planSpread", plan.key)}</span>
        </div>
        <div class="plan-card-body">
          <div class="stat-strip">
            <div class="stat-tile">
              <div class="label">${t("perSiteSavings")}</div>
              <div class="value good">${fmtMoney(annual.totalSavingsCents)}</div>
            </div>
            <div class="stat-tile">
              <div class="label">${t("networkSavingsLabel", state.siteCount)}</div>
              <div class="value good">${fmtMoney(annual.totalSavingsCents * state.siteCount)}</div>
            </div>
          </div>
          <div class="hint-inline" style="margin-bottom:10px; font-size:11px; color:var(--text-muted);">${t("reserveDeductedNote", reserveKwh.toFixed(1), usableKwh.toFixed(1))}</div>
          <div class="price-band-row">
            <span class="price-band ${c1[2]}">${t("band", c1[0])} ${c1[1]}</span>
            <span class="price-band ${c2[2]}">${t("band", c2[0])} ${c2[1]}</span>
            <span class="price-band ${c3[2]}">${t("band", c3[0])} ${c3[1]}</span>
          </div>
          <div class="daytype-tabs" data-plan="${plan.key}">
            ${plan.dayTypes.map(dt => `<button data-day="${dt.key}" class="${dt.key === activeKey ? 'active' : ''}">${t("dayType", dt.key)}</button>`).join("")}
          </div>
          <div class="chart-wrap">
            <div class="chart-grid">
              <div class="y-axis-title">${t("kwAxisTitle")}</div>
              <div class="y-axis-ticks">
                <span>${maxBar.toFixed(1)}</span>
                <span>${(maxBar / 2).toFixed(1)}</span>
                <span>0</span>
              </div>
              <div class="price-strip">
                ${priceSegments(activeDT.hourly).map(seg => {
                  const hours = seg.end - seg.start;
                  const tier = priceTierClass(seg.price, activeDT.hourly);
                  const label = hours >= 3 ? `${seg.start}–${seg.end}${hs} ${seg.price}¢` : "";
                  return `<div class="price-seg tier-${tier}" style="flex:${hours} 0 0" title="${seg.start}${hs}–${seg.end}${hs}${t("colon")}${seg.price}¢/kWh">${label}</div>`;
                }).join("")}
              </div>
              <div class="chart">
                ${sim.hours.map(slot => {
                  const gridBase = Math.max(0, Math.min(slot.grid, P));
                  const chargeExtra = Math.max(0, slot.grid - P);
                  const battOut = slot.batteryOut || 0;
                  const gridBaseH = gridBase / maxBar * 100;
                  const chargeH = chargeExtra / maxBar * 100;
                  const battH = battOut / maxBar * 100;
                  return `<div class="hour-col" title="${slot.h}${hs}${t("colon")}${t("gridLabel")} ${gridBase.toFixed(1)}kW${chargeExtra > 0 ? ' + ' + t("chargeLabel") + ' ' + chargeExtra.toFixed(1)+'kW' : ''}${battOut > 0 ? ' · ' + t("dischargeLabel") + ' ' + battOut.toFixed(1)+'kW' : ''}">
                    <div class="bar-segment bar-battery" style="height:${battH}%"></div>
                    <div class="bar-segment bar-charge" style="height:${chargeH}%"></div>
                    <div class="bar-segment bar-grid" style="height:${gridBaseH}%"></div>
                  </div>`;
                }).join("")}
              </div>
              <div class="hour-axis">
                ${sim.hours.map(slot => `<div class="hour-tick ${slot.h % 3 === 0 ? 'major' : ''}">${slot.h % 3 === 0 ? slot.h + hs : ''}</div>`).join("")}
              </div>
              <div class="x-axis-title">${t("hourAxisTitle")}</div>
            </div>
          </div>
          <div class="legend">
            <span><span class="dot" style="background:var(--text-muted)"></span>${t("gridSupplyLegend")}</span>
            <span><span class="dot" style="background:var(--charge)"></span>${t("batteryChargeLegend")}</span>
            <span><span class="dot" style="background:var(--good)"></span>${t("batteryDischargeLegend")}</span>
          </div>
        </div>
      </div>
    `;
  }

  function render() {
    const P = computeSiteKw();
    $("#computedKw").textContent = P.toFixed(2) + " kW";
    $("#overrideKw").value = state.overrideKw;
    $("#overrideRow").style.display = state.override ? "grid" : "none";

    // outage-hours source: generator (user-editable bridging time) vs LDC lookup (Ontario, read-only) vs manual (Quebec)
    const ldcSel = $("#ldcSelect");
    const outageInput = $("#outageHours");
    const ldcDriven = state.province === "on" && !state.hasGenerator;
    ldcSel.disabled = !ldcDriven;
    if (state.province !== "on") {
      ldcSel.value = "";
    } else if (ldcDriven) {
      ldcSel.value = state.ldc;
    } else {
      ldcSel.value = "";
    }
    const placeholderOpt = $("#opt-ldc-placeholder");
    placeholderOpt.textContent = state.province !== "on" ? t("ldcNotApplicableQc") : (state.hasGenerator ? t("ldcNotApplicableGen") : "");
    $("#ldcMapSection").style.display = ldcDriven ? "" : "none";
    setLdcHighlight(ldcDriven ? state.ldc : null);
    if (ldcDriven) {
      state.outageHours = Math.round(ldcCaidi(state.ldc) * 100) / 100;
      outageInput.value = state.outageHours.toFixed(2);
      outageInput.readOnly = true;
    } else {
      outageInput.readOnly = false;
      if (document.activeElement !== outageInput) outageInput.value = state.outageHours;
    }

    const usableKwh = state.batteryN * BATTERY_USABLE_KWH;
    const maxKw = state.batteryN * BATTERY_MAX_KW;

    // reserved SOC floor for outage backup
    const reserveKwh = state.outageHours * P;
    const socFloorPct = usableKwh > 0 ? (reserveKwh / usableKwh) * 100 : 0;
    const socFloorEl = $("#socFloorValue");
    socFloorEl.classList.toggle("warn", socFloorPct > 100);
    socFloorEl.textContent = usableKwh > 0 ? Math.min(999, socFloorPct).toFixed(0) + "%" : "—";
    $("#socFloorHint").textContent = socFloorPct > 100
      ? t("socFloorOverNote", state.outageHours, state.batteryN)
      : t("socFloorNormalNote", state.outageHours);

    // backup time highlight
    const backupHours = P > 0 ? usableKwh / P : Infinity;
    const backupValueEl = $("#backupValue");
    backupValueEl.textContent = isFinite(backupHours) ? backupHours.toFixed(1) + " " + t("hourUnit") : "—";

    const need1CWarn = P > maxKw;
    const arbitrageKwh = Math.max(0, usableKwh - reserveKwh);
    const notes = [];
    if (state.province === "qc") {
      notes.push(t("qcEmsNote"));
    } else {
      notes.push(t("meterAssumptionNote"));
    }
    if (need1CWarn) {
      notes.push(t("powerShortageNote", P.toFixed(1), state.batteryN, maxKw.toFixed(1)));
    }
    if (arbitrageKwh <= 0) {
      notes.push(t("noArbitrageMarginNote", reserveKwh.toFixed(1)));
    }
    $("#feasibilityNote").innerHTML = notes.join("");

    const plan = PLANS[state.plan];
    $("#planResult").innerHTML = renderPlanCard(plan, P, arbitrageKwh, maxKw, reserveKwh);

    $$(".daytype-tabs button").forEach(btn => {
      btn.onclick = () => {
        const planKey = btn.closest(".daytype-tabs").dataset.plan;
        state.activeDayType[planKey] = btn.dataset.day;
        render();
      };
    });

    // sensitivity: per-battery average annual savings across battery counts (1..24 — beyond that isn't realistically deployable), rendered as a bar chart
    const MAX_BATTERIES = 24;
    const counts = Array.from({ length: MAX_BATTERIES }, (_, i) => i + 1);
    const totalVals = counts.map(n => annualSavings(plan, P, Math.max(0, n * BATTERY_USABLE_KWH - reserveKwh), n * BATTERY_MAX_KW).totalSavingsCents / 100);
    const vals = totalVals.map((v, i) => v / counts[i]); // $ per battery per year, averaged

    const nMin = Math.max(0, Math.min(MAX_BATTERIES, Math.ceil(reserveKwh / BATTERY_USABLE_KWH)));
    const maxSens = Math.max(...vals, 1);
    const barColor = plan.key === "tou" ? "var(--tou)" : plan.key === "ulo" ? "var(--ulo)" : "var(--qc)";

    const M = { left: 78, right: 985, top: 34, bottom: 190 };
    const midY = (M.top + M.bottom) / 2;
    const slot = (M.right - M.left) / MAX_BATTERIES;
    const barW = slot * 0.5;
    const countRowY = M.bottom + 16;
    const roiRowY = M.bottom + 34;

    $("#sensChart").innerHTML = `
      <line x1="${M.left}" y1="${M.bottom}" x2="${M.right}" y2="${M.bottom}" stroke="var(--border)" stroke-width="1.5"/>
      <text x="${M.left - 8}" y="${M.top + 4}" text-anchor="end" font-size="10" fill="var(--text-muted)" font-family="'Roboto Mono', monospace">${fmtMoney(maxSens*100)}</text>
      <text x="${M.left - 8}" y="${midY + 4}" text-anchor="end" font-size="10" fill="var(--text-muted)" font-family="'Roboto Mono', monospace">${fmtMoney(maxSens*50)}</text>
      <text x="${M.left - 8}" y="${M.bottom + 4}" text-anchor="end" font-size="10" fill="var(--text-muted)" font-family="'Roboto Mono', monospace">$0</text>
      <text x="16" y="${midY}" text-anchor="middle" font-size="10" fill="var(--text-muted)" transform="rotate(-90 16 ${midY})">${t("sensYAxis")}</text>
      <text x="${M.left - 8}" y="${countRowY + 3}" text-anchor="end" font-size="9.5" font-weight="600" fill="var(--text-muted)">${t("sensCountLabel")}</text>
      <text x="${M.left - 8}" y="${roiRowY + 3}" text-anchor="end" font-size="9.5" font-weight="600" fill="var(--text-muted)">${t("sensRoiLabel")}</text>
      ${counts.map((n, i) => {
        const barH = Math.max(0, (vals[i] / maxSens) * (M.bottom - M.top));
        const x = M.left + (n - 1) * slot + (slot - barW) / 2;
        const y = M.bottom - barH;
        const isCurrent = n === state.batteryN;
        const isFloor = n === nMin;
        const stroke = isCurrent ? "var(--good)" : (isFloor ? "var(--warn)" : "none");
        const strokeW = isCurrent || isFloor ? 3 : 0;
        const roiYears = totalVals[i] > 0 ? (state.batteryPrice * (n - nMin)) / totalVals[i] : Infinity;
        const roiText = n <= nMin ? "—" : (isFinite(roiYears) ? (roiYears > 99 ? ">99" : roiYears.toFixed(1)) : "—");
        const roiColor = n <= nMin ? "var(--text-muted)" : (roiYears <= 10 ? "var(--good)" : "var(--warn)");
        return `
          <text x="${(x + barW/2).toFixed(1)}" y="${(y - 5).toFixed(1)}" text-anchor="middle" font-size="8.5" font-weight="700" fill="var(--text-muted)" font-variant-numeric="tabular-nums">$${Math.round(vals[i])}</text>
          <rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${barW.toFixed(1)}" height="${barH.toFixed(1)}" rx="2" fill="${barColor}" stroke="${stroke}" stroke-width="${strokeW}"/>
          <text x="${(x + barW/2).toFixed(1)}" y="${roiRowY + 3}" text-anchor="middle" font-size="8.5" font-weight="700" fill="${roiColor}" font-variant-numeric="tabular-nums">${roiText}</text>
          <text x="${(x + barW/2).toFixed(1)}" y="${countRowY}" text-anchor="middle" font-size="9" fill="var(--text-muted)" font-variant-numeric="tabular-nums">${n}</text>
        `;
      }).join("")}
    `;

    // "Should you switch to ULO?" panel — Ontario only (Quebec has a single plan, no switch to evaluate)
    const switchPanel = $("#switchPanel");
    if (state.province === "on") {
      switchPanel.style.display = "";
      if (document.activeElement !== $("#horizonYears")) $("#horizonYears").value = state.horizonYears;
      const touOpt = findOptimalPlan(PLANS.tou, P, reserveKwh, state.batteryPrice, state.horizonYears, nMin);
      $("#txt-switchBaseline").textContent = t("switchBaseline", touOpt.n, touOpt.bill);

      const uloCounts = [];
      for (let n = nMin; n <= MAX_BATTERIES; n++) uloCounts.push(n);
      const paybacks = uloCounts.map(n => {
        const usable = Math.max(0, n * BATTERY_USABLE_KWH - reserveKwh);
        const bill = annualBillDollars(PLANS.ulo, P, usable, n * BATTERY_MAX_KW);
        const total = n * state.batteryPrice + state.horizonYears * bill;
        const extraCapex = (n - touOpt.n) * state.batteryPrice;
        const annualSaving = touOpt.bill - bill;
        const payback = annualSaving > 0 ? extraCapex / annualSaving : Infinity;
        return { n, bill, total, payback };
      });
      let sweetIdx = -1, sweetVal = Infinity;
      paybacks.forEach((p, i) => { if (isFinite(p.payback) && p.payback < sweetVal) { sweetVal = p.payback; sweetIdx = i; } });

      const headerRow = `<tr><td style="font-weight:600; color:var(--text-muted); padding:6px 8px; white-space:nowrap;">${t("switchColBattery")}</td>${uloCounts.map(n => `<td style="text-align:center; padding:6px 8px; font-weight:600; color:var(--text-muted);">${n}</td>`).join("")}</tr>`;
      const touCostRow = `<tr><td style="font-weight:600; color:var(--tou); padding:6px 8px; white-space:nowrap; border-top:1px solid var(--border);">${t("switchColTouCost", state.horizonYears)}</td>${touOpt.all.map(r => {
        const isMin = r.n === touOpt.n;
        return `<td style="text-align:center; padding:6px 8px; border-top:1px solid var(--border); background:${isMin ? "var(--tou)" : "transparent"}; color:${isMin ? "#fff" : "var(--text-muted)"}; border-radius:${isMin ? "4px" : "0"}; font-weight:${isMin ? "700" : "400"};">$${Math.round(r.total).toLocaleString()}</td>`;
      }).join("")}</tr>`;
      let uloMinIdx = 0;
      paybacks.forEach((p, i) => { if (p.total < paybacks[uloMinIdx].total) uloMinIdx = i; });
      const uloCostRow = `<tr><td style="font-weight:600; color:var(--ulo); padding:6px 8px; white-space:nowrap; border-top:1px solid var(--border);">${t("switchColUloCost", state.horizonYears)}</td>${paybacks.map((p, i) => {
        const isMin = i === uloMinIdx;
        return `<td style="text-align:center; padding:6px 8px; border-top:1px solid var(--border); background:${isMin ? "var(--ulo)" : "transparent"}; color:${isMin ? "#fff" : "var(--text-muted)"}; border-radius:${isMin ? "4px" : "0"}; font-weight:${isMin ? "700" : "400"};">$${Math.round(p.total).toLocaleString()}</td>`;
      }).join("")}</tr>`;
      // compare against TOU's own best total cost (the one real alternative), not a hypothetical "TOU with N batteries"
      const winnerRow = `<tr><td style="font-weight:600; color:var(--text-muted); padding:6px 8px; white-space:nowrap; border-top:1px solid var(--border);">${t("switchColWinner")}</td>${paybacks.map(p => {
        const touWins = touOpt.total <= p.total;
        return `<td style="text-align:center; padding:6px 8px; border-top:1px solid var(--border); color:${touWins ? "var(--tou)" : "var(--ulo)"}; font-weight:700;">${touWins ? "TOU" : "ULO"}</td>`;
      }).join("")}</tr>`;
      const touBillRow = `<tr><td style="font-weight:600; color:var(--text-muted); padding:6px 8px; white-space:nowrap; border-top:1px solid var(--border);">${t("switchColTouBill")}</td>${touOpt.all.map(r => {
        return `<td style="text-align:center; padding:6px 8px; border-top:1px solid var(--border); color:var(--text-muted);">$${Math.round(r.bill).toLocaleString()}</td>`;
      }).join("")}</tr>`;
      const billRow = `<tr><td style="font-weight:600; color:var(--text-muted); padding:6px 8px; white-space:nowrap; border-top:1px solid var(--border);">${t("switchColBill")}</td>${paybacks.map(p => {
        return `<td style="text-align:center; padding:6px 8px; border-top:1px solid var(--border); color:var(--text-muted);">$${Math.round(p.bill).toLocaleString()}</td>`;
      }).join("")}</tr>`;
      const paybackRow = `<tr><td style="font-weight:600; color:var(--text-muted); padding:6px 8px; white-space:nowrap; border-top:1px solid var(--border);">${t("switchColPayback")}</td>${paybacks.map((p, i) => {
        const isSweet = i === sweetIdx;
        const text = isFinite(p.payback) ? p.payback.toFixed(1) : "—";
        const bg = isSweet ? "var(--good)" : "transparent";
        const color = isSweet ? "#fff" : (isFinite(p.payback) ? "var(--text)" : "var(--text-muted)");
        return `<td style="text-align:center; padding:6px 8px; border-top:1px solid var(--border); background:${bg}; color:${color}; border-radius:${isSweet ? "4px" : "0"}; font-weight:${isSweet ? "700" : "400"};">${text}</td>`;
      }).join("")}</tr>`;
      $("#switchTable").innerHTML = headerRow + touCostRow + uloCostRow + winnerRow + touBillRow + billRow + paybackRow;
    } else {
      switchPanel.style.display = "none";
    }
  }

  // ---------- wire up controls ----------
  $("#provinceSelect").addEventListener("change", e => {
    state.province = e.target.value;
    if (!state.hasGenerator) state.outageHours = OUTAGE_HOURS_DEFAULT[state.province];
    updatePlanOptions();
    applyStaticText();
    render();
  });
  $("#planSelect").addEventListener("change", e => { state.plan = e.target.value; render(); });
  $("#siteCount").addEventListener("input", e => { state.siteCount = Math.max(1, parseInt(e.target.value, 10) || 1); render(); });
  $("#sectors").addEventListener("change", e => { state.sectors = parseFloat(e.target.value) || 0; render(); });
  $("#has4g").addEventListener("change", e => { state.has4g = e.target.value === "1"; render(); });
  $("#has5g").addEventListener("change", e => { state.has5g = e.target.value === "1"; render(); });
  $("#hasGenerator").addEventListener("change", e => {
    state.hasGenerator = e.target.value === "1";
    if (state.hasGenerator) state.outageHours = GENERATOR_OUTAGE_HOURS_DEFAULT;
    applyStaticText();
    render();
  });
  $("#ldcSelect").addEventListener("change", e => {
    if (e.target.value) state.ldc = e.target.value;
    applyStaticText();
    render();
  });

  $("#overrideCheck").addEventListener("change", e => {
    state.override = e.target.checked;
    render();
  });
  $("#overrideKw").addEventListener("input", e => {
    state.overrideKw = parseFloat(e.target.value) || 0;
    render();
  });

  $("#batteryCount").addEventListener("input", e => {
    state.batteryN = Math.max(1, Math.min(24, parseInt(e.target.value, 10) || 1));
    render();
  });
  $("#outageHours").addEventListener("input", e => {
    state.outageHours = Math.max(0, parseFloat(e.target.value) || 0);
    render();
  });
  $("#horizonYears").addEventListener("input", e => {
    state.horizonYears = Math.max(1, parseFloat(e.target.value) || 10);
    render();
  });
  $("#batteryPrice").addEventListener("input", e => {
    state.batteryPrice = Math.max(0, parseFloat(e.target.value) || 0);
    render();
  });

  $$("#langSwitch button").forEach(btn => btn.addEventListener("click", () => {
    state.lang = btn.dataset.lang;
    $$("#langSwitch button").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    applyStaticText();
    render();
  }));

  // dev-only override: append ?lang=zh to the URL to preview the Chinese build (no visible button)
  const devLang = new URLSearchParams(location.search).get("lang");
  if (devLang && T[devLang]) {
    state.lang = devLang;
    $$("#langSwitch button").forEach(b => b.classList.toggle("active", b.dataset.lang === devLang));
  }

  $$(".ldc-territory").forEach(el => {
    el.addEventListener("mouseenter", () => setLdcHighlight(el.dataset.key));
    el.addEventListener("focus", () => setLdcHighlight(el.dataset.key));
    el.addEventListener("mouseleave", () => setLdcHighlight(state.province === "on" && !state.hasGenerator ? state.ldc : null));
    el.addEventListener("blur", () => setLdcHighlight(state.province === "on" && !state.hasGenerator ? state.ldc : null));
    el.addEventListener("click", () => selectLdcFromMap(el.dataset.key));
  });

  updatePlanOptions();
  applyStaticText();
  render();
</script>
</body>
</html>
